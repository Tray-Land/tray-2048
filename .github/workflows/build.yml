name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore Tray2048.csproj

    - name: Build
      run: dotnet build Tray2048.csproj --configuration Release --no-restore /p:PublishReadyToRun=false /p:Platform=x64

    - name: Test
      run: dotnet test tests/Tray2048.Tests/Tray2048.Tests.csproj --configuration Release
